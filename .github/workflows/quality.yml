name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/landing/package-lock.json
            apps/studio/package-lock.json
      - name: Install landing dependencies
        run: npm --prefix apps/landing ci
      - name: Install Studio dependencies
        run: npm --prefix apps/studio ci
      - name: Audit dependencies
        run: |
          npm --prefix apps/landing audit --audit-level=high
          npm --prefix apps/studio audit --audit-level=high
      - name: Scan for secrets
        shell: pwsh
        run: ./scripts/security-scan.ps1
      - name: Build
        run: npm run build
